<section id="experience" class="section">
  <h2 class="section-title">Work Experience</h2>
  <p class="section-subtitle">
    A journey through my professional career, highlight achievements, and technologies used.
  </p>

  <div class="timeline">
    <!-- Vertical timeline line -->
    <div class="timeline-line"></div>

    <!-- Timeline Items -->
    <div class="timeline-item" *ngFor="let exp of experiences" [class.timeline-item-right]="exp.side === 'right'">
      <!-- Timeline Node / Icon -->
      <div class="timeline-node">
        <img *ngIf="exp.logo" [src]="exp.logo" [alt]="exp.company + ' logo'" class="node-logo" />
        <mat-icon *ngIf="!exp.logo" class="node-icon">work</mat-icon>
      </div>

      <!-- Timeline Content Card -->
      <div class="timeline-content">
        <mat-card class="experience-card glass-card">
          <mat-card-header class="experience-header">
            <div class="header-main">
              <mat-card-title class="role-title">{{ exp.role }}</mat-card-title>
              <mat-card-subtitle class="company-name">{{ exp.company }}</mat-card-subtitle>
            </div>
            <div class="header-meta">
              <div class="meta-item">
                <mat-icon class="meta-icon">calendar_today</mat-icon>
                <span>{{ exp.duration }}</span>
              </div>
              <div class="meta-item">
                <mat-icon class="meta-icon">place</mat-icon>
                <span>{{ exp.location }}</span>
              </div>
            </div>
          </mat-card-header>

          <mat-card-content class="experience-content">
            <ul class="duties-list">
              <li class="duty-item" *ngFor="let point of exp.description">
                <mat-icon class="bullet-icon">chevron_right</mat-icon>
                <span class="duty-text">{{ point }}</span>
              </li>
            </ul>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
  </div>
</section>
